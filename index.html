<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kharla Piano - Importar SF2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/soundfont2@0.4.0/dist/soundfont2.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F5F5DC;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .vst-container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid #333;
            max-width: 95%;
            margin: 20px 0;
        }
        h1 { margin: 0; font-size: 1.3rem; color: #fff; text-align: center; }
        
        #status {
            font-size: 0.85rem;
            color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 193, 7, 0.3);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            margin: 10px 0;
        }
        #status.connected {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
        }
        #status.loading {
            color: #2196f3;
            background: rgba(33, 150, 243, 0.1);
            border-color: rgba(33, 150, 243, 0.3);
        }
        
        .controls-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            align-items: center;
            margin-top: 15px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }
        label {
            font-size: 0.8rem;
            color: #bbb;
            font-weight: bold;
        }
        select, input[type="range"] {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .piano-wrapper {
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            margin-top: 20px;
        }
        .piano {
            display: flex;
            position: relative;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            height: 200px;
        }
        .key {
            position: absolute;
            cursor: pointer;
            border-radius: 0 0 4px 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            font-size: 0.6rem;
            font-weight: 600;
            box-sizing: border-box;
            transition: background 0.1s;
        }
        .white {
            width: 34px;
            height: 180px;
            background: #fdfdfd;
            border: 1px solid #b5b5b5;
            color: #555;
            z-index: 1;
        }
        .white.active {
            background: #00bcd4 !important;
            color: #000 !important;
        }
        .black {
            width: 20px;
            height: 110px;
            background: #222;
            color: #888;
            z-index: 3;
            border-radius: 0 0 3px 3px;
            border: 1px solid #000;
            font-size: 0.5rem;
        }
        .black.active {
            background: #ff5722 !important;
            color: #fff !important;
        }
        
        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    
    <h2 style="color: #000000; margin-bottom: 10px;">Kharla Web Solution</h2>

    <div class="vst-container">
        
        <h1>🎹 Kharla Piano - Ciro</h1>
        
        <div id="status">⚠️ Importa un archivo SF2 para comenzar</div>
        
        <!-- ⭐ BOTÓN CON ESTILOS INLINE - SE VERÁ SÍ O SÍ -->
        <button id="import-btn" style="
            width: 100%;
            background: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
            display: block;
            margin: 15px 0;
            text-align: center;
        ">
            📁 Importar SoundFont (.sf2)
        </button>
        <input type="file" id="file-input" accept=".sf2" />
        
        <div class="controls-row">
            <div class="control-group">
                <label for="midi-input">Entrada MIDI USB:</label>
                <select id="midi-input">
                    <option value="">Buscando...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="midi-output">Salida MIDI USB:</label>
                <select id="midi-output">
                    <option value="">(Ninguna)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="volume">Volumen:</label>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
            </div>

            <div class="control-group">
                <label for="reverb">Reverb:</label>
                <input type="range" id="reverb" min="0" max="1" step="0.05" value="0.3">
            </div>
        </div>

        <div class="piano-wrapper" id="piano-wrapper">
            <div class="piano" id="keyboard"></div>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const keyboardDiv = document.getElementById('keyboard');
        const reverbSlider = document.getElementById('reverb');
        const volumeSlider = document.getElementById('volume');
        const midiInputSelect = document.getElementById('midi-input');
        const midiOutputSelect = document.getElementById('midi-output');
        const fileInput = document.getElementById('file-input');
        const importBtn = document.getElementById('import-btn');

        const startNote = 36;
        const numKeys = 61;   
        const midiElements = {};
        const activeVoices = {};
        
        let sustainActive = false;
        const sustainedNotes = new Set();

        let currentMidiAccess = null;
        let activeMidiInput = null;
        let activeMidiOutput = null;

        const noteNames = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, mainMasterGain, convolverNode, wetGain, dryGain;
        
        let sf2Synth = null;
        let sf2Loaded = false;

        importBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.name.toLowerCase().endsWith('.sf2')) {
                alert('Por favor selecciona un archivo .sf2 válido');
                return;
            }
            
            try {
                statusDiv.textContent = `⏳ Cargando ${file.name}... (puede tardar)`;
                statusDiv.className = "loading";
                importBtn.disabled = true;
                
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                    
                    mainMasterGain = audioCtx.createGain();
                    mainMasterGain.gain.value = parseFloat(volumeSlider.value);

                    convolverNode = audioCtx.createConvolver();
                    createReverbImpulse();

                    wetGain = audioCtx.createGain();
                    dryGain = audioCtx.createGain();
                    updateReverbMix(parseFloat(reverbSlider.value));

                    mainMasterGain.connect(dryGain);
                    mainMasterGain.connect(convolverNode);
                    convolverNode.connect(wetGain);
                    dryGain.connect(audioCtx.destination);
                    wetGain.connect(audioCtx.destination);
                }
                
                const arrayBuffer = await file.arrayBuffer();
                sf2Synth = new SoundFont2(audioCtx, arrayBuffer);
                sf2Synth.connect(mainMasterGain);
                
                sf2Loaded = true;
                statusDiv.textContent = `✅ ${file.name} cargado. ¡A tocar!`;
                statusDiv.className = "connected";
                importBtn.disabled = false;
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
            } catch (error) {
                console.error("Error cargando SF2:", error);
                statusDiv.textContent = "❌ Error al cargar: " + error.message;
                statusDiv.className = "";
                importBtn.disabled = false;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            if (mainMasterGain && audioCtx) {
                mainMasterGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
            }
        });

        function createReverbImpulse() {
            const rate = audioCtx.sampleRate;
            const length = rate * 2.0; 
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (rate * 0.5));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            convolverNode.buffer = impulse;
        }

        function updateReverbMix(val) {
            if (!wetGain || !dryGain) return;
            wetGain.gain.value = val;
            dryGain.gain.value = 1.0 - (val * 0.5);
        }

        reverbSlider.addEventListener('input', (e) => {
            updateReverbMix(parseFloat(e.target.value));
        });

        function releaseSustainedNotes() {
            sustainedNotes.forEach(note => {
                const keyElement = midiElements[note];
                if (keyElement) keyElement.classList.remove('active');
                if (keyElement && !keyElement.hasAttribute('data-pressed')) {
                    stopNoteInstance(note, true);
                }
            });
            sustainedNotes.clear();
        }

        function buildKeyboard() {
            const whiteKeyWidth = 34;
            let whiteIndex = 0;

            let totalWhiteKeys = 0;
            for (let i = 0; i < numKeys; i++) {
                const nInOct = (startNote + i) % 12;
                if (![1, 3, 6, 8, 10].includes(nInOct)) totalWhiteKeys++;
            }
            keyboardDiv.style.width = `${totalWhiteKeys * whiteKeyWidth}px`;

            for (let i = 0; i < numKeys; i++) {
                const noteNumber = startNote + i;
                const noteInOctave = noteNumber % 12;
                const octave = Math.floor(noteNumber / 12) - 1;
                const isBlack = [1, 3, 6, 8, 10].includes(noteInOctave);
                
                const key = document.createElement('div');
                key.className = `key ${isBlack ? 'black' : 'white'}`;
                key.dataset.note = noteNumber;
                
                key.innerHTML = `<span>${noteNames[noteInOctave]}</span><span style="font-size:0.5rem; opacity:0.6;">${octave}</span>`;

                key.addEventListener('mousedown', () => {
                    key.setAttribute('data-pressed', 'true');
                    noteOn(noteNumber, 100, true);
                });
                key.addEventListener('mouseup', () => {
                    key.removeAttribute('data-pressed');
                    noteOff(noteNumber, true);
                });
                key.addEventListener('mouseleave', () => {
                    if (key.hasAttribute('data-pressed')) {
                        key.removeAttribute('data-pressed');
                        noteOff(noteNumber, true);
                    }
                });

                key.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    key.setAttribute('data-pressed', 'true');
                    noteOn(noteNumber, 100, true);
                }, { passive: false });

                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    key.removeAttribute('data-pressed');
                    noteOff(noteNumber, true);
                });

                if (!isBlack) {
                    key.style.left = `${whiteIndex * whiteKeyWidth}px`;
                    keyboardDiv.appendChild(key);
                    whiteIndex++;
                } else {
                    key.style.left = `${(whiteIndex * whiteKeyWidth) - 10}px`;
                    keyboardDiv.appendChild(key);
                }

                midiElements[noteNumber] = key;
            }
        }
        buildKeyboard();

        function noteOn(note, velocity, fromMouse = false) {
            if (!sf2Loaded) {
                statusDiv.textContent = "⚠️ Primero importa un archivo SF2";
                statusDiv.className = "";
                return;
            }
            
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const keyElement = midiElements[note];
            if (keyElement) keyElement.classList.add('active');

            sustainedNotes.delete(note);

            if (activeVoices[note]) stopNoteInstance(note, false);

            if (sf2Synth) {
                try {
                    sf2Synth.noteOn(0, note, velocity / 127);
                    activeVoices[note] = true;
                } catch (e) {
                    console.warn("Error al reproducir nota", note, e);
                }
            }

            if (fromMouse && activeMidiOutput) {
                activeMidiOutput.send([144, note, velocity]);
            }
        }

        function noteOff(note, fromMouse = false) {
            const keyElement = midiElements[note];
            if (!sustainActive && keyElement) {
                keyElement.classList.remove('active');
            }

            if (sustainActive) {
                sustainedNotes.add(note);
            } else {
                stopNoteInstance(note, true);
            }

            if (fromMouse && activeMidiOutput) {
                activeMidiOutput.send([128, note, 0]);
            }
        }

        function stopNoteInstance(note, gradualRelease = true) {
            if (activeVoices[note]) {
                try {
                    sf2Synth.noteOff(0, note);
                } catch (e) {
                    console.warn("Error al soltar nota", note, e);
                }
                delete activeVoices[note];
            }
        }

        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        } else {
            statusDiv.textContent = "Web MIDI no soportado.";
        }

        function onMIDISuccess(midiAccess) {
            currentMidiAccess = midiAccess;
            updateMidiPorts();
            currentMidiAccess.onstatechange = () => updateMidiPorts();
        }

        function onMIDIFailure() {
            statusDiv.textContent = "Error al inicializar MIDI.";
        }

        function updateMidiPorts() {
            const inputs = Array.from(currentMidiAccess.inputs.values());
            const currentInId = midiInputSelect.value;
            midiInputSelect.innerHTML = '';

            if (inputs.length === 0) {
                midiInputSelect.add(new Option("Sin entradas USB", ""));
            } else {
                inputs.forEach(input => midiInputSelect.add(new Option(input.name, input.id)));
                if (inputs.some(i => i.id === currentInId)) midiInputSelect.value = currentInId;
            }
            connectInput();

            const outputs = Array.from(currentMidiAccess.outputs.values());
            const currentOutId = midiOutputSelect.value;
            midiOutputSelect.innerHTML = '<option value="">(Sin Salida)</option>';
            outputs.forEach(output => midiOutputSelect.add(new Option(output.name, output.id)));
            if (outputs.some(o => o.id === currentOutId)) midiOutputSelect.value = currentOutId;
            connectOutput();
        }

        function connectInput() {
            if (activeMidiInput) {
                activeMidiInput.onmidimessage = null;
                activeMidiInput = null;
            }
            const selectedId = midiInputSelect.value;
            if (selectedId && currentMidiAccess) {
                const input = currentMidiAccess.inputs.get(selectedId);
                if (input) {
                    activeMidiInput = input;
                    activeMidiInput.onmidimessage = handleIncomingMidiMessage;
                }
            }
        }

        function connectOutput() {
            activeMidiOutput = null;
            const selectedId = midiOutputSelect.value;
            if (selectedId && currentMidiAccess) {
                const output = currentMidiAccess.outputs.get(selectedId);
                if (output) activeMidiOutput = output;
            }
        }

        midiInputSelect.addEventListener('change', connectInput);
        midiOutputSelect.addEventListener('change', connectOutput);

        function handleIncomingMidiMessage(message) {
            const statusByte = message.data[0];
            const data1 = message.data[1];
            const data2 = message.data[2];
            const command = statusByte & 0xF0; 

            if (command === 0xB0 && data1 === 64) {
                sustainActive = (data2 >= 64);
                if (!sustainActive) releaseSustainedNotes();
                if (activeMidiOutput) activeMidiOutput.send(message.data);
                return;
            }

            if (command === 0x90 && data2 > 0) {
                noteOn(data1, data2);
                if (activeMidiOutput) activeMidiOutput.send(message.data);
            } else if (command === 0x80 || (command === 0x90 && data2 === 0)) {
                noteOff(data1);
                if (activeMidiOutput) activeMidiOutput.send(message.data);
            }
        }

        document.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
