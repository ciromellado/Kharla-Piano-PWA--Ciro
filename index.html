<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kharla Piano PWA</title>
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Enlace al Manifest de la PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">

    <!-- Carga de smplr (SplendidGrandPiano, YamahaC7, DX7) vía módulo ES -->
    <script type="module">
        async function loadSmplr() {
            try {
                const mod = await import("https://esm.sh/smplr@0.20.0?target=es2022");
                window.SplendidGrandPiano = mod.SplendidGrandPiano || mod.default;
                window.YamahaC7 = mod.YamahaC7; // NUEVO
                window.DX7 = mod.DX7;          // NUEVO
                console.log("✅ Instrumentos smplr cargados correctamente.");
            } catch (e) {
                console.error("❌ Error cargando smplr:", e);
            }
        }
        loadSmplr();
    </script>
</head>
<body>
    
    <!-- Envoltorio de perspectiva 3D para dar el efecto físico de consola / rack de estudio -->
    <div class="vst-perspective-wrapper">
        <div class="vst-container">
            <div class="title-bar">
                <h1>🎹 Kharla Piano PWA-2</h1>
                <div id="status">✅ Listo para tocar</div>
            </div>

            <div class="chord-display-panel">
                <div class="chord-info-group">
                    <span class="chord-label">Acorde Detectado</span>
                    <div id="chord-name" class="chord-name">Esperando notas...</div>
                </div>
                <div class="chord-info-group">
                    <span class="chord-label">Notas Activas</span>
                    <div id="notes-detected" class="notes-detected">Ninguna</div>
                </div>
            </div>
            
            <div class="controls-row">
                <div class="control-group">
                    <label for="midi-input">Entrada MIDI USB:</label>
                    <select id="midi-input">
                        <option value="">Buscando...</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="midi-output">Salida MIDI USB:</label>
                    <select id="midi-output">
                        <option value="">(Ninguna)</option>
                    </select>
                </div>

                <!-- Selector de Color / Tema del Piano -->
                <div class="control-group">
                    <label for="theme-selector">Color de Interfaz:</label>
                    <select id="theme-selector" style="background: #1e242b; color: #fff; border: 1px solid #3b4754; padding: 8px; border-radius: 4px;">
                        <option value="dark-black">Negro Clásico (Actual)</option>
                        <option value="modern-gray">Red Elegante Nord</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="preset">Tipo de Sonido:</label>
                    <select id="preset">
                        <optgroup label="Pianos Acústicos">
                            <option value="splendid">🎹 Splendid Grand Piano (Samples Reales)</option>
                            <option value="yamaha_c7">🎹 Yamaha C7 Grand Piano (Concierto)</option>
                            <option value="grand">Grand Acoustic (Sintetizado)</option>
                            <option value="bright">Bright Piano</option>
                            <option value="warm">Warm Piano</option>
                        </optgroup>
                        <optgroup label="Pianos Eléctricos">
                            <option value="electric">Electric Piano (Rhodes)</option>
                            <option value="dx7">🎹 Yamaha DX7 (FM Synth Classic)</option>
                            <option value="wurlitzer">Wurlitzer (Vintage)</option>
                        </optgroup>
                        <optgroup label="Acordeones Colombianos">
                            <option value="accordion_vallenato">Acordeón Vallenato (Típico)</option>
                            <option value="accordion_cumbia">Acordeón de Cumbia / Bajos</option>
                        </optgroup>
                        <optgroup label="Órganos">
                            <option value="hammond">Órgano Hammond (Rock/Jazz)</option>
                            <option value="pipe_organ">Órgano de Tubos (Litúrgico)</option>
                        </optgroup>
                        <optgroup label="Cuerdas (Strings)">
                            <option value="string1">String 1 (Ensemble Cálido)</option>
                            <option value="string2">String 2 (Brillante / Staccato)</option>
                        </optgroup>
                        <optgroup label="Metales y Vientos">
                            <option value="trumpet">Trompeta (Brass)</option>
                            <option value="saxophone">Saxofón (Reed)</option>
                            <option value="trombone">Trombón (Deep Brass)</option>
                        </optgroup>
                    </select>
                </div>
                
                <!-- Perilla de Volumen Master (5 Niveles) -->
                <div class="control-group knob-group">
                    <label>Volumen Master</label>
                    <div class="knob" id="knob-volume" data-level="3" title="Clic para girar (1-5)">
                        <div class="knob-indicator"></div>
                    </div>
                    <span class="knob-value-label" id="val-volume">Nivel 3</span>
                </div>

                <!-- Perilla de Reverberación (5 Niveles) -->
                <div class="control-group knob-group">
                    <label>Reverberación</label>
                    <div class="knob" id="knob-reverb" data-level="2" title="Clic para girar (1-5)">
                        <div class="knob-indicator"></div>
                    </div>
                    <span class="knob-value-label" id="val-reverb">Nivel 2</span>
                </div>

                <!-- Perilla de Chorus (5 Niveles: 1=OFF, 2-5=Intensidad) -->
                <div class="control-group knob-group">
                    <label>Efecto Chorus</label>
                    <div class="knob" id="knob-chorus" data-level="1" title="Clic para girar (1-5)">
                        <div class="knob-indicator"></div>
                    </div>
                    <span class="knob-value-label" id="val-chorus">OFF</span>
                </div>

                <!-- Perilla de Delay (5 Niveles: 1=OFF, 2-5=Intensidad) -->
                <div class="control-group knob-group">
                    <label>Efecto Delay</label>
                    <div class="knob" id="knob-delay" data-level="1" title="Clic para girar (1-5)">
                        <div class="knob-indicator"></div>
                    </div>
                    <span class="knob-value-label" id="val-delay">OFF</span>
                </div>

                <!-- SECCIÓN NUEVA: Nord Synth Pad -->
                <div class="control-group pad-section-group" style="border: 1px solid #3e4b5b; padding: 10px; border-radius: 8px; background: linear-gradient(to bottom, #252b33, #1c2229);">
                    <label style="color: #ff8c00; font-weight: bold;">Nord Synth Pad</label>
                    <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                        <!-- Botón On/Off del Pad -->
                        <button id="btn-pad-toggle" class="pad-btn-off" style="padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; background: #3b4754; color: #fff;">OFF</button>
                        
                        <!-- Selector de Sonido Pad -->
                        <select id="pad-preset" style="background: #1e242b; color: #fff; border: 1px solid #3b4754; padding: 6px; border-radius: 4px;">
                            <option value="warm_pad">Warm Pad</option>
                            <option value="soft_strings">Soft Strings</option>
                            <option value="analog_sweep">Analog Sweep</option>
                        </select>
                    </div>
                    
                    <!-- Perilla o control de volumen del Pad -->
                    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                        <span style="font-size: 11px; color: #94a3b8;">Volumen Pad:</span>
                        <div class="knob" id="knob-pad-vol" data-level="3" title="Volumen del Pad (1-5)" style="transform: scale(0.7); transform-origin: left center; width: 35px; height: 35px; margin: 0;">
                            <div class="knob-indicator"></div>
                        </div>
                        <span class="knob-value-label" id="val-pad-vol" style="font-size: 11px;">Nivel 3</span>
                    </div>
                </div>
                <!-- FIN SECCIÓN NUEVA -->

            </div>

            <div class="piano-wrapper" id="piano-wrapper">
                <div class="piano" id="keyboard"></div>
            </div>
        </div>
    </div>

    <!-- Script principal externo -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('✅ Service Worker registrado con éxito:', reg.scope);
                    })
                    .catch((err) => {
                        console.log('❌ Error al registrar el Service Worker:', err);
                    });
            });
        }
    </script>
</body>
</html>
